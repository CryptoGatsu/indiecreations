<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="/deathrace3000/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>DeathRace3000</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="game">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="loader">
      <div class="brand">DEATHRACE<span>3000</span></div>
      <div class="tag">Outrun the wall. Cash out or double up.</div>
      <div class="bar"><div id="fill"></div></div>
      <div id="status">loading…</div>
    </div>
    <div id="rotate">
      <div class="phone"></div>
      <div>Turn your phone sideways</div>
    </div>
    <script src="/presence.js" data-game="deathrace3000" defer></script>
    <script src="TemplateData/dr-config.js" onerror="window.DR_CONFIG = window.DR_CONFIG || {}"></script>
    <script src="TemplateData/dr-bridge.js"></script>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
      // phones: render at up to 1.5x device pixels to keep the frame rate up
      // integrated laptop GPUs (the common case for browsers): 1.25x keeps text sharp at far less fill cost
      var gpu = "";
      try { var gl = document.createElement("canvas").getContext("webgl2"); var ext = gl && gl.getExtension("WEBGL_debug_renderer_info"); gpu = ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)).toLowerCase() : ""; } catch (e) {}
      var integrated = /intel|uhd|iris|swiftshader|llvmpipe|basic render|mali|adreno|powervr/.test(gpu);
      var dpr = Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : (integrated ? 1.25 : 2));
      function fit() {
        document.getElementById("rotate").style.display = (mobile && window.innerHeight > window.innerWidth) ? "flex" : "none";
      }
      window.addEventListener("resize", fit);
      window.addEventListener("orientationchange", fit);
      fit();
      // first touch: go full screen and lock landscape where the browser allows it
      function immersive() {
        if (!mobile) return;
        var el = document.documentElement;
        var fs = el.requestFullscreen || el.webkitRequestFullscreen;
        if (fs && !document.fullscreenElement) { try { var p = fs.call(el); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
      }
      document.addEventListener("touchend", immersive, { once: true });

      var ready = false;
      window.drReady = function () {
        if (ready) return;
        ready = true;
        document.getElementById("loader").classList.add("done");
        setTimeout(function () { document.getElementById("loader").style.display = "none"; }, 600);
      };
      window.drLoading = function (text) { if (!ready) document.getElementById("status").textContent = text; };

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DeathRace3000",
        productName: "DeathRace3000",
        productVersion: "0.1.0",
        devicePixelRatio: dpr,
        webglContextAttributes: { alpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' },
      }, function (progress) {
        document.getElementById("fill").style.width = Math.round(progress * 100) + "%";
        document.getElementById("status").textContent = progress < 0.9 ? "loading " + Math.round(progress * 100) + "%" : "starting engines…";
      }).then(function (unityInstance) {
        window.unityInstance = unityInstance;
        if (window.DR) window.DR.attach(unityInstance);
        // the game calls drReady() once its shaders are compiled; never leave the loader up for long regardless
        setTimeout(window.drReady, 20000);
      }).catch(function (message) {
        document.getElementById("status").textContent = "Couldn't start: " + message;
      });
    </script>
  </body>
</html>
