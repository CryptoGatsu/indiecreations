<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing in…</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0b0a; color: #e8e2dc;
           font: 16px/1.4 system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  </style>
</head>
<body>
  <p id="msg">Signing you in to DeathRace3000…</p>
  <script>
    // X sends the player back here with ?code&state (or ?error). Hand it to the game window and close;
    // if there is no game window (pop-ups were blocked), stash it and go back to the game.
    (function () {
      var q = new URLSearchParams(location.search);
      var data = { type: 'dr-x', code: q.get('code'), state: q.get('state'), error: q.get('error') };
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(data, '*');
        document.getElementById('msg').textContent = 'Signed in — you can close this window.';
        setTimeout(function () { window.close(); }, 300);
        return;
      }
      try {
        var pend = JSON.parse(sessionStorage.getItem('dr_x_pending') || '{}');
        pend.code = data.code; pend.state = data.state;
        if (data.error) pend.code = null;
        sessionStorage.setItem('dr_x_pending', JSON.stringify(pend));
      } catch (e) { /* storage unavailable */ }
      location.replace('index.html');
    })();
  </script>
</body>
</html>
